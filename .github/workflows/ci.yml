name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Regression and safety tests
        run: python -m unittest discover -s tests -v
      - name: Documentation and source hygiene
        run: python scripts/check_docs.py
      - name: Actual CLI lifecycle smoke
        run: python scripts/smoke.py
      - name: Install pinned build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build wheel and source archive
        run: python -m build --no-isolation --outdir dist
      - name: Verify clean offline installation and sdist rebuild
        run: python scripts/release_check.py --dist dist > dist/release-report.json
      - name: Retain tested candidate packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-at-manef-candidate-${{ matrix.os }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  secure-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install optional test-only security tools from the signed OS package repository
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age minisign
      - name: Verify real-tool encrypted recovery with throwaway identities
        run: python scripts/secure_recovery_check.py
